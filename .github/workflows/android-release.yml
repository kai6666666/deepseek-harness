name: android-release
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '出包原因（写进 job summary）'
        required: false
        default: ''

jobs:
  assemble:
    name: assemble (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: system
            task: System
          - flavor: gecko
            task: Gecko
    env:
      ASSETS_TAG: ${{ github.event.inputs.assets_release || vars.ASSETS_RELEASE }}
      STRICT_ASSETS: ${{ github.event.inputs.strict_assets || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Android SDK（platform 35 + build-tools 35 + NDK 27）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: true

      - name: 修可执行位（仓库从 Android 文件系统提交，没带 +x）
        run: chmod +x gradlew tools/*.sh || true

      - name: 铺构建资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci-fetch-assets.sh

      - name: 现场构建 engine.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          VER=0.2.2-alpha.2 OUT="$GITHUB_WORKSPACE/app/src/main/assets/engine.bin" \
            bash tools/build-engine-bin.sh

      # ⚠️ 这一项以前**没有任何步骤负责**，于是 CI 出的包在真机上是残的：
      #   #9  Termux 引导失败 java.io.FileNotFoundException: bootstrap-aarch64.zip
      #   #27 node --version 校验失败 … library "libz.so.1" not found
      # 两条日志看着无关，其实是同一个洞 —— 前缀没铺，libz/libssl 全缺。
      # build-bootstrap.sh 会把 Termux 官方 bootstrap 落到 assets 并做三道体检
      # （条目数 / SYMLINKS.txt / bootstrap-required.txt 里的 soname）。
      - name: 现场取 Termux bootstrap（bootstrap-aarch64.zip）
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/bootstrap-aarch64.zip" \
            bash tools/build-bootstrap.sh

      - name: 现场构建 node-runtime.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/node-runtime.bin" \
            bash tools/build-node-runtime.sh

      - name: 现场构建原生产物 + pnpm
        run: bash tools/build-native-assets.sh

      - name: 现场打包插件资产（15 个 zip）
        run: bash tools/build-plugin-assets.sh

      # node-pty 没有 android 预编译二进制，用 NDK 从它自带的 src/unix/pty.cc 现编。
      # -static-libstdc++ 是硬要求：动态链会拉 libc++_shared.so，Termux 里没有。
      - name: 现场编 node-pty 绑定
        run: bash tools/build-node-pty.sh

      - name: 现场构建 sharp / ripgrep / adb
        run: bash tools/build-extra-native.sh

      # 需要 engine 副本里的 src/flock.c，所以只在「无 Release 现场装引擎」时跑。
      - name: 现场编 node-addon-system（flock 绑定）
        if: env.ASSETS_TAG == ''
        run: bash tools/build-node-addon-system.sh

      # 唯一造不出的一项：npm 包无 C 源码。有源码/外部产物就编，没有就 ::warning:: 并跳过。
      - name: node-addon-require-builtin（插槽）
        if: env.ASSETS_TAG == ''
        run: bash tools/build-node-addon-require-builtin.sh

      # check-frontend-syntax.mjs 需要 acorn；CI 里它自装会因 npm 告警走到 rc=2（＝跳检）。
      - name: 预装 acorn
        run: npm i --no-save --no-audit --no-fund acorn@8

      # PowerShell 版的 Python 移植：esbuild 降级 + 语法复检 + 运行时 API 审计
      - name: 现场生成 webview-compat
        if: env.ASSETS_TAG == ''
        run: |
          if [ -f tools/build-webview_compat.py ]; then
            python3 tools/build-webview_compat.py --engine /tmp/dsh-engine-0.2.2-alpha.2
          else
            echo "::notice title=webview-compat::tools/build-webview_compat.py 不在仓库里，跳过"
          fi

      - name: 资产闸门（缺 bootstrap 直接失败）
        run: |
          a=app/src/main/assets
          miss=0
          for f in engine.bin node-runtime.bin bootstrap-aarch64.zip; do
            if [ -s "$a/$f" ]; then
              echo "✅ $f $(du -h "$a/$f" | cut -f1)"
            else
              echo "::error::缺少关键资产 $f —— 这个包装到真机上引擎起不来"
              miss=1
            fi
          done
          exit $miss

      - name: 工具链自检
        run: |
          java -version
          bash ./gradlew --version --console=plain | sed -n '1,12p'
          echo "ASSETS_TAG=${ASSETS_TAG:-<none>}"

      - name: 编译门禁（engine 包，不需要资产）
        run: KTCACHE="$HOME/.kt" bash tools/verify-engine.sh

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks 2>/dev/null || true
          echo "keystore bytes: $(wc -c < keystore.jks)"
          head -c 16 keystore.jks | od -An -tx1 | head -1
          if keytool -list -keystore keystore.jks -storepass "$KS_PASS" >/dev/null 2>&1; then
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > keystore.properties
            chmod 600 keystore.jks keystore.properties
            echo "::notice title=keystore::JKS 有效，Release 将签名"
          else
            rm -f keystore.jks keystore.properties
            echo "::warning title=keystore::KEYSTORE_BASE64 解码后不是有效 JKS（Tag number over 30 / 密码不符），本轮出 unsigned 包"
          fi
      - name: 构建 APK
        run: |
          set +e
          bash ./gradlew :app:assemble${{ matrix.task }}Release -x lint --console=plain --stacktrace 2>&1 | tee /tmp/apk-build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error title=gradle-rc::exit $rc"
            grep -n -A8 'What went wrong' /tmp/apk-build.log | head -24 | while IFS= read -r l; do echo "::error title=detail::$l"; done
            grep -E '^(FAILURE:|Caused by:|e: |> Task .* FAILED)' /tmp/apk-build.log | head -10 | while IFS= read -r l; do echo "::error title=gradle::$l"; done
          fi
          exit $rc

      - name: 产物清单
        if: always()
        run: |
          echo '--- apk ---'
          find app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null || echo '(no apk)'
          echo '--- 资产体积 ---'
          du -sh app/src/main/assets || true
          ls -lh app/src/main/assets/*.bin 2>/dev/null || true

      # 产物自证：不看构建日志的自述，直接拆开 APK 检查「真机上会用到的东西」在不在。
      # 这一条是因为踩过两个洞：
      #   ① bootstrap-aarch64.zip 没人造 → 真机 node 缺 libz.so.1，引擎永远起不来；
      #   ② 设置页下拉菜单 z-index 低于设置面板 → 菜单开了但被盖住，看着像"点了没反应"。
      - name: 产物自证（关键资产 + 两段运行时补丁）
        run: |
          set -e
          apk=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "APK: $apk"
          [ -n "$apk" ] || { echo "::error::找不到 release APK"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/bootstrap-aarch64.zip' \
            || { echo "::error::APK 缺 assets/bootstrap-aarch64.zip（真机 Termux 前缀铺不起来）"; exit 1; }
          unzip -p "$apk" assets/webview-polyfill.js > /tmp/pf.js
          for k in dsh-menu-zfix __dshClickDedupe; do
            grep -q "$k" /tmp/pf.js \
              || { echo "::error::webview-polyfill.js 缺 $k（设置页下拉/顶栏下拉会复发）"; exit 1; }
          done
          echo "✅ bootstrap 在包里；polyfill 含 dsh-menu-zfix + __dshClickDedupe"

      - name: Verify signature
        run: |
          set +e
          APK=$(ls app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk 2>/dev/null | head -1)
          echo "APK=${APK:-<none>}"
          [ -n "$APK" ] || { echo "::error title=apk::未产出 APK"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$sha"
          if "$BT/apksigner" verify --print-certs "$APK"; then
            echo "::notice title=signature::APK 签名可验 sha256=$sha"
          else
            echo "::warning title=signature::unsigned APK（keystore secret 无效），sha256=$sha"
          fi
          exit 0
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.flavor }}-release
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
            app/build/outputs/apk/${{ matrix.flavor }}/release/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7