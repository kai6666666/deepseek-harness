name: build-apk

# 唯一目的：产出一个**能装、能跑**的 debug APK，用来做真机验证
#   （G-03 的 Kotlin 与 G-23 的 proot 都只过了"编译"，没过"真跑"）
#
# 关键点：rootfs **不在 git 里**（55 MB），所以在 CI 里现做一遍再塞进 assets，
# 这样打包出来的 APK 首启才有东西可解，preBuild 闸门也能真实通过（不靠 SKIP）。

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "flavor（system 不拉 geckoview，包小）"
        required: false
        default: "system"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 补 SDK 组件
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: 恢复二进制资产（GitHub Release 附件 dsh-assets-v1.zip，135 MB）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/assets-v1"
          URL=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$REL" | python3 -c "import json,sys;print(next((x['url'] for x in json.load(sys.stdin).get('assets',[]) if x['name']=='dsh-assets-v1.zip'),''))")
          if [ -z "$URL" ]; then echo "::error::release assets-v1 里没有 dsh-assets-v1.zip"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" "$URL" -o /tmp/assets.zip
          ls -lh /tmp/assets.zip
          mkdir -p app/src/main/assets
          unzip -o -q /tmp/assets.zip -d app/src/main/assets -x 'mobile-ui.zip'
          # ⚠️ 排除 mobile-ui.zip：它已在 git 里（改过设置项，见"移除交流群"那次提交），
          #    如果被 Release 附件里的旧版覆盖，改了也白改。
          echo "assets 恢复后: $(ls -1 app/src/main/assets | wc -l) 项 / $(du -sh app/src/main/assets | cut -f1)"
          ls -1 app/src/main/assets | head -12

      - name: 现做 rootfs（含 node 24 断言）
        run: |
          set -uo pipefail
          bash tools/alpine-runtime/build-rootfs.sh --out dist --expect-node-major 24 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          sudo chown -R "$(id -u):$(id -g)" dist || true
          ls -l dist || true
          exit "$rc"

      - name: 塞进 assets（sha256 + Node 主版本都会验）
        run: bash tools/fetch-rootfs-into-assets.sh --from dist

      - name: 闸门预检（与 preBuild 调的是同一个脚本）
        run: bash tools/verify-runtime-assets.sh

      - name: 打包 system debug
        env:
          FLAVOR: ${{ inputs.flavor || 'system' }}
        run: |
          set -uo pipefail
          chmod +x gradlew
          ./gradlew ":app:assemble${FLAVOR^}Debug" --no-daemon --console=plain --stacktrace 2>&1 | tail -60
          rc=${PIPESTATUS[0]}
          echo "gradle exit=$rc"
          find app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null || true
          exit "$rc"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

      - name: 摘要
        if: always()
        run: |
          {
            echo "### APK 构建"
            echo ""
            ls -lh app/build/outputs/apk/*/debug/*.apk 2>/dev/null || echo "（没有 APK）"
            echo ""
            echo "rootfs: $(du -h app/src/main/assets/runtime/alpine-rootfs.tar.gz 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"