name: 发布 APK 到 Release（手动）

# 为什么单独一条 workflow：
# `apk.yml` 在 main push 后**立刻**发布，早于任何真机验收（历史事故：PR 构建把
# v0.4.4-test 的资产覆盖成 PR 代码）。这里把「出包」与「发布」拆开：
#   G7 只出包（apk.yml，PUBLISH_FROM_APK 默认关闭）
#   G8 人工验收通过后，用 run_id 指定那一次构建，再发布
#
# 用法：
#   gh workflow run publish-apk.yml --ref main -f run_id=123456789 -f tag=v0.2.2-rc.3-debug

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '要发布的 apk.yml 构建 run id'
        required: true
      tag:
        description: 'Release tag（例如 v0.2.2-rc.3-debug）'
        required: true
      src_ref:
        description: '版本文件的来源分支（必须与 run_id 那次构建的 ref 一致，默认 main）'
        required: false
        default: 'main'
      prerelease:
        description: '1 = prerelease（默认）；0 = 正式版位'
        required: false
        default: '1'
      artifact_name:
        description: '取哪个 artifact（debug: dsh-system-debug；正式: dsh-system-release）'
        required: false
        default: 'dsh-system-debug'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: publish-from-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 版本文件必须来自**那次构建的分支**，否则 tag/versionName 断言会拿 main 的旧值
      # （实测 run 44151465607：main 上仍是 0.2.2-rc.1，tag=v0.2.2-rc.3-debug 被判不一致）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.src_ref }}

      - name: 取指定 run 的 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: 校验产物与版本同源
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find dist -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo '::error::该 run 没有 APK artifact'; exit 1; }
          V_NAME=$(grep '^versionName=' tools/app-version.txt | cut -d= -f2 | tr -d ' \r\n')
          V_CODE=$(grep '^versionCode=' tools/app-version.txt | cut -d= -f2 | tr -d ' \r\n')
          E_VER=$(tr -d ' \r\n' < tools/engine-version.txt)
          echo "APK=$APK vName=$V_NAME vCode=$V_CODE engine=$E_VER tag=${{ inputs.tag }}"
          # ⚠️ versionCode 必须**严格递增**：防止把旧版本重新打 tag 覆盖线上产物。
          # 取最近一个正式 release 的 versionCode 做比较（拿不到就跳过，不阻塞首次发布）。
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq '[.[] | select(.prerelease == false)] | .[0].tag_name' 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "null" ] && [ "$PREV" != "v$V_NAME" ]; then
            PREV_CODE=$(gh api "repos/${{ github.repository }}/releases/tags/$PREV" \
              --jq '.body' 2>/dev/null | grep -o 'versionCode [0-9]*' | head -1 | grep -o '[0-9]*' || true)
            if [ -n "$PREV_CODE" ]; then
              echo "上一个正式版 $PREV 的 versionCode=$PREV_CODE，本次=$V_CODE"
              [ "$V_CODE" -gt "$PREV_CODE" ] || { echo "::error::versionCode 必须大于上一个正式版（$PREV_CODE）"; exit 1; }
            else
              echo "上一个正式版 $PREV 的 versionCode 读不到，跳过递增校验"
            fi
          else
            echo "没有可比较的历史正式版，跳过递增校验"
          fi
          # tag 必须与 versionName 对齐（tag 带 v，versionName 不带）
          [ "${{ inputs.tag }}" = "v$V_NAME" ] || { echo "::error::tag 与 versionName 不一致"; exit 1; }
          NAME="dsh-android-${V_NAME}-arm64.apk"
          mkdir -p out
          cp -f "$APK" "out/$NAME"
          ( cd out && sha256sum "$NAME" > SHA256SUMS.txt )
          cat out/SHA256SUMS.txt
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "V_NAME=$V_NAME" >> "$GITHUB_ENV"
          echo "V_CODE=$V_CODE" >> "$GITHUB_ENV"
          echo "E_VER=$E_VER" >> "$GITHUB_ENV"

      - name: 建 / 更新 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE=$( [ "${{ inputs.prerelease }}" = "1" ] && echo "DSH Android 调试包（${{ inputs.tag }}）" || echo "DSH Android ${{ inputs.tag }}（PRoot 单运行时）" )
          NOTE=$(printf 'engine @deepseek-ai/dsh@%s（PRoot 单运行时）\n\n- versionName **%s** / versionCode **%s**\n- sha256 见 SHA256SUMS.txt\n- 来源 run: %s\n' \
            "$E_VER" "$V_NAME" "$V_CODE" "${{ inputs.run_id }}")
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ inputs.tag }}" --notes "$NOTE" \
              $( [ "${{ inputs.prerelease }}" = "1" ] && echo --prerelease || echo --latest )
          else
            gh release create "${{ inputs.tag }}" \
              --title "$TITLE" \
              --notes "$NOTE" \
              $( [ "${{ inputs.prerelease }}" = "1" ] && echo --prerelease || echo --latest )
          fi
          gh release upload "${{ inputs.tag }}" "out/$APK_NAME" out/SHA256SUMS.txt --clobber
          gh release view "${{ inputs.tag }}" --json tagName,isPrerelease,assets \
            -q '"\(.tagName) prerelease=\(.isPrerelease) assets=\([.assets[].name]|join(","))"'