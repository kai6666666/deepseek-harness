name: publish-release-from-run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run id containing dsh-system-release / dsh-gecko-release'
        required: true
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.4.3'
      target_commitish:
        description: 'Commit SHA the tag should point to'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-*-release
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Normalize names
        run: |
          set -e
          find dist -type f -ls
          mkdir -p out
          SYS=$(find dist/dsh-system-release -name '*.apk' | head -1)
          GECKO=$(find dist/dsh-gecko-release -name '*.apk' | head -1)
          test -n "$SYS" && test -n "$GECKO"
          cp "$SYS" out/dsh-android-0.4.3-arm64.apk
          cp "$GECKO" out/dsh-android-0.4.3-gecko-arm64.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## DSH Android 0.4.3

          - 引擎：`@deepseek-ai/dsh@0.2.2-rc.1`
          - pnpm：`11.28.5`
          - 移动端 UI：`1.1.0-162`
          - 锚点：`15/15`，补丁标记：`5/5`
          - 会话格式：`v4`，旧会话可直接读取

          ### 安装

          覆盖安装即可保留数据：

          - `dsh-android-0.4.3-arm64.apk`：系统 WebView 版
          - `dsh-android-0.4.3-gecko-arm64.apk`：Gecko 版

          `v0.4.2` 保持不变。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.target_commitish }}
          name: ${{ inputs.tag }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true