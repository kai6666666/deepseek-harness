name: publish-release-from-run

# 版本号唯一真源：app/build.gradle.kts 的 versionName，且必须等于
# tools/engine-version.txt（= @deepseek-ai/dsh 官方版本号）。
# tag 留空即自动 v<versionName>；填了但与 versionName 不符直接失败——
# 这条闸门用来防 2026-11-16 那种「工作流自己造一个 0.5.0 抢 Latest」的事故。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run id containing dsh-system-release / dsh-gecko-release'
        required: true
      tag:
        description: 'Release tag；留空 = v{gradle versionName}'
        required: false
        default: ''
      target_commitish:
        description: 'Commit SHA the tag should point to；留空 = 本次触发分支 HEAD'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 版本对齐闸门
        run: python3 tools/check-version-alignment.py
      - name: 解析版本（唯一真源）
        id: ver
        run: |
          set -e
          VER=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -e 's/.*=[[:space:]]*"//' -e 's/".*//')
          VC=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -e 's/.*=[[:space:]]*//')
          ENG=$(tr -d ' \r\n' < tools/engine-version.txt)
          MUI=$(tr -d ' \r\n' < tools/mobile-ui-version.txt)
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="v$VER"
          [ "$TAG" = "v$VER" ] || { echo "::error title=tag::tag($TAG) ≠ v{versionName}=v$VER"; exit 1; }
          [ "$VER" = "$ENG" ] || { echo "::error title=version::versionName($VER) ≠ engine-version($ENG)"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "engine=$ENG" >> "$GITHUB_OUTPUT"
          echo "mui=$MUI" >> "$GITHUB_OUTPUT"
          echo "ver=$VER vc=$VC tag=$TAG engine=$ENG mui=$MUI"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-*-release
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Normalize names
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          find dist -type f -ls
          mkdir -p out
          SYS=$(find dist/dsh-system-release -name '*.apk' | head -1)
          GECKO=$(find dist/dsh-gecko-release -name '*.apk' | head -1)
          test -n "$SYS" && test -n "$GECKO"
          cp "$SYS" "out/dsh-${VERSION}-system-release.apk"
          cp "$GECKO" "out/dsh-${VERSION}-gecko-release.apk"
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VC: ${{ steps.ver.outputs.code }}
          ENGINE: ${{ steps.ver.outputs.engine }}
          MUI: ${{ steps.ver.outputs.mui }}
        run: |
          set -e
          {
            echo "## DSH Android ${VERSION}"
            echo
            echo "- 引擎：\`@deepseek-ai/dsh@${ENGINE}\`（版本号与官方对齐）"
            echo "- versionName：\`${VERSION}\` / versionCode：\`${VC}\`"
            echo "- 移动端 UI：\`${MUI}\`"
            echo "- 单运行时：引擎 / bash / uid2000 / root / 沙箱全部跑在 PRoot 内"
            echo
            echo "### 资产"
            echo
            echo "- \`dsh-${VERSION}-system-release.apk\`：系统 WebView 版"
            echo "- \`dsh-${VERSION}-gecko-release.apk\`：Gecko 版"
            echo "- \`SHA256SUMS.txt\`"
            echo
            echo "### 安装"
            echo
            echo "覆盖安装即可保留数据；首次安装约需 90 秒解包 rootfs。"
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ inputs.target_commitish || github.sha }}
          name: DSH Android ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
