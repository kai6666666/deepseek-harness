name: 构建 APK（x86_64 runner）

# 为什么必须在这里构建：本机是 arm64，Google 的 build-tools 只发 x86_64 二进制
# （d8 / zipalign / apksigner 没有 linux-arm64 版本），所以本机只能配置工程、
# 编 Kotlin（见 ci.yml 的 engine-compile），出包交给 ubuntu-latest。
#
# 资产不入库。没有 Release 时，工作流现场自建：
#   engine.bin（npm）· node-runtime.bin（Termux deb）· 三个 C 适配层（NDK）· pnpm

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'bundle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/apk.yml'
      - 'tools/ci-fetch-assets.sh'
      - 'tools/build-engine-bin.sh'
      - 'tools/build-node-runtime.sh'
      - 'tools/build-native-assets.sh'
      - 'tools/build-plugin-assets.sh'
      - 'tools/build-node-pty.sh'
      - 'tools/build-extra-native.sh'
      - 'tools/build-node-addon-system.sh'
      - 'tools/build-webview_compat.py'
      - 'tools/build-node-addon-require-builtin.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_release:
        description: '存放构建资产的 Release tag（留空则读 vars.ASSETS_RELEASE，再空则现场自建）'
        required: false
        default: ''
      strict_assets:
        description: '1 = 缺资产就失败；0 = 降级出包'
        required: false
        default: '0'

# 本工作流在分支上要建 Release（公开可下载，绕开 Actions artifact 需要登录的限制）。
permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assembleSystemDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETS_TAG: ${{ github.event.inputs.assets_release || vars.ASSETS_RELEASE }}
      STRICT_ASSETS: ${{ github.event.inputs.strict_assets || '0' }}
      REL_TAG: v0.4.3-debug
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Android SDK（platform 35 + build-tools 35 + NDK 27）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: true

      - name: 修可执行位（仓库从 Android 文件系统提交，没带 +x）
        run: chmod +x gradlew tools/*.sh || true

      - name: 铺构建资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci-fetch-assets.sh

      - name: 现场构建 engine.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          VER=0.2.2-rc.1 OUT="$GITHUB_WORKSPACE/app/src/main/assets/engine.bin" \
            bash tools/build-engine-bin.sh

      - name: 现场构建 node-runtime.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/node-runtime.bin" \
            bash tools/build-node-runtime.sh

      - name: 现场构建原生产物 + pnpm
        run: bash tools/build-native-assets.sh

      - name: 现场打包插件资产（15 个 zip）
        run: bash tools/build-plugin-assets.sh

      # node-pty 没有 android 预编译二进制，用 NDK 从它自带的 src/unix/pty.cc 现编。
      # -static-libstdc++ 是硬要求：动态链会拉 libc++_shared.so，Termux 里没有。
      - name: 现场编 node-pty 绑定
        run: bash tools/build-node-pty.sh

      - name: 现场构建 sharp / ripgrep / adb
        run: bash tools/build-extra-native.sh

      # 需要 engine 副本里的 src/flock.c，所以只在「无 Release 现场装引擎」时跑。
      - name: 现场编 node-addon-system（flock 绑定）
        if: env.ASSETS_TAG == ''
        run: bash tools/build-node-addon-system.sh

      # 唯一造不出的一项：npm 包无 C 源码。有源码/外部产物就编，没有就 ::warning:: 并跳过。
      - name: node-addon-require-builtin（插槽）
        if: env.ASSETS_TAG == ''
        run: bash tools/build-node-addon-require-builtin.sh

      # check-frontend-syntax.mjs 需要 acorn；CI 里它自装会因 npm 告警走到 rc=2（＝跳检）。
      - name: 预装 acorn
        run: npm i --no-save --no-audit --no-fund acorn@8

      # PowerShell 版的 Python 移植：esbuild 降级 + 语法复检 + 运行时 API 审计
      - name: 现场生成 webview-compat
        if: env.ASSETS_TAG == ''
        run: |
          if [ -f tools/build-webview_compat.py ]; then
            python3 tools/build-webview_compat.py --engine /tmp/dsh-engine-0.2.2-rc.1
          else
            echo "::notice title=webview-compat::tools/build-webview_compat.py 不在仓库里，跳过"
          fi

      - name: 工具链自检
        run: |
          java -version
          bash ./gradlew --version --console=plain | sed -n '1,12p'
          echo "ASSETS_TAG=${ASSETS_TAG:-<none>}"

      - name: 编译门禁（engine 包，不需要资产）
        run: KTCACHE="$HOME/.kt" bash tools/verify-engine.sh

      # main 上的 0.2.2-rc1（vc47）已判定为废弃版；本分支出包直接改成 0.4.3-debug。
      # versionCode 仍递增到 48（已装 vc47 的设备可覆盖安装，不必卸载清数据）。
      - name: 版本戳 0.4.3-debug（vc=48）
        run: |
          sed -i 's/versionCode = 47/versionCode = 48/' app/build.gradle.kts
          sed -i 's/versionName = "0.2.2-rc1"/versionName = "0.4.3-debug"/' app/build.gradle.kts
          python3 -c "import pathlib;c=pathlib.Path('CHANGELOG.md');t=c.read_text(encoding='utf-8');b='## [0.4.3-debug] — 2026-11-07\nvc=48\n\n### 变更\n\n- 引擎 `@deepseek-ai/dsh` 0.2.2-rc.1（与 main 同），锚点门禁：官方 5/5、`EngineManager` 13 对 `*_GUARD` 13/13。\n- versionName 0.2.2-rc1 → **0.4.3-debug**；versionCode 47 → **48**（保持严格递增，已装 vc47 的设备可覆盖安装）。\n- 0.2.2-rc1（vc47）已判定为**废弃版**，不再维护该命名。\n- `engine.bin` 本地候选：81,609,187 B，sha256 3f164e306419b214464904ae176877c6879bd7ff67ca3905afd81af88ba71ad4。\n\n---\n\n';c.write_text((b+t) if '## [0.4.3-debug]' not in t else t,encoding='utf-8')"
          grep -n 'versionCode = \|versionName = ' app/build.gradle.kts
          sh tools/version.sh --check

      - name: 构建 APK
        run: bash ./gradlew :app:assembleSystemDebug --console=plain --stacktrace

      - name: 产物清单
        if: always()
        run: |
          echo '--- apk ---'
          find app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null || echo '(no apk)'
          echo '--- 资产体积 ---'
          du -sh app/src/main/assets || true
          ls -lh app/src/main/assets/*.bin 2>/dev/null || true

      - name: 上传 APK（Actions artifact，内部）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-system-debug
          path: |
            app/build/outputs/apk/system/debug/*.apk
            app/build/outputs/apk/system/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      # 关键一步：artifact 下载需要登录，Release 资产不需要。
      # 公开仓库 ⇒ 公开 GET https://github.com/<owner>/<repo>/releases/download/<tag>/<name> 即可拉。
      - name: 发布到 Release（公开可下）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/system/debug -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::找不到 APK"; exit 1; }
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "APK=$APK size=$SIZE sha256=$SHA"
          NOTES=$(printf '引擎 `@deepseek-ai/dsh@0.2.2-rc.1`（与 main 同）\n\n- versionName **0.4.3-debug** / versionCode **48**\n- APK 字节数 `%s`\n- sha256 `%s`\n- 锚点门禁：官方 5/5、EngineManager 13 对 *_GUARD 13/13\n' "$SIZE" "$SHA")
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$APK#dsh-android-0.4.3-debug-arm64.apk" --clobber
          else
            gh release create "$REL_TAG" "$APK#dsh-android-0.4.3-debug-arm64.apk" \
              --title "0.4.3-debug（引擎 0.2.2-rc.1 / vc=48）" \
              --notes "$NOTES" --prerelease
          fi
          gh release view "$REL_TAG" --json assets -q '.assets[] | "\(.name) \(.size) \(.url)"'

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
