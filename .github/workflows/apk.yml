name: 构建 APK（x86_64 runner）

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'bundle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/apk.yml'
      - 'tools/ci-fetch-assets.sh'
      - 'tools/build-engine-bin.sh'
      - 'tools/build-node-runtime.sh'
      - 'tools/node-runtime-wrap.sh'
      - 'tools/build-native-assets.sh'
      - 'tools/build-plugin-assets.sh'
      - 'tools/build-node-pty.sh'
      - 'tools/build-extra-native.sh'
      - 'tools/build-node-addon-system.sh'
      - 'tools/build-webview_compat.py'
      - 'tools/build-node-addon-require-builtin.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_release:
        description: '存放构建资产的 Release tag（留空则读 vars.ASSETS_RELEASE，再空则现场自建）'
        required: false
        default: ''
      strict_assets:
        description: '1 = 缺资产就失败；0 = 降级出包'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 运行时资产（PRoot rootfs）单独一个 job：产物与 APK 构建解耦，
  # 失败时能一眼看出是「运行时坏」还是「APK 坏」。缓存只放下载物。
  runtime:
    name: runtime (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 依赖（交叉编译器 + patchelf + xz）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf xz-utils gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Node 24（构建机用）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载缓存
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rt-cache
          key: rt-cache-v1-ubuntu24.04.5-node24.22.1

      - name: 组装 rootfs + manifest + jniLibs
        env:
          DSH_RT_WORK: ${{ runner.temp }}/rt-work
          DSH_RT_CACHE: ${{ runner.temp }}/rt-cache
          DSH_RT_OUT: ${{ github.workspace }}/_build/runtime/out
          CC: aarch64-linux-gnu-gcc
        run: bash tools/runtime/build-runtime.sh

      - name: 硬断言
        run: |
          python3 tools/runtime/verify.py \
            _build/runtime/out/arm64-v8a/assets/runtime/rootfs-arm64-v8a.tar.xz \
            _build/runtime/out/arm64-v8a/assets/runtime/manifest.json \
            _build/runtime/out/arm64-v8a/jniLibs/arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-arm64-v8a
          path: _build/runtime/out/**
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: assembleSystemDebug
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETS_TAG: ${{ github.event.inputs.assets_release || vars.ASSETS_RELEASE }}
      STRICT_ASSETS: ${{ github.event.inputs.strict_assets || '0' }}
      REL_TAG: v0.4.4-test
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-


      - name: Android SDK（platform 35 + build-tools 35 + NDK 27）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: true

      - name: 修可执行位（仓库从 Android 文件系统提交，没带 +x）
        run: chmod +x gradlew tools/*.sh || true

      - name: 取运行时资产
        uses: actions/download-artifact@v4
        with:
          name: runtime-arm64-v8a
          path: _build/runtime/out

      - name: 铺运行时资产（assets/runtime + jniLibs）
        run: |
          set -e
          mkdir -p app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a
          cp -r _build/runtime/out/arm64-v8a/assets/runtime/.  app/src/main/assets/runtime/
          cp _build/runtime/out/arm64-v8a/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a

      - name: mobile-ui 版本戳（读 tools/mobile-ui-version.txt）
        run: |
          set -e
          EM=app/src/main/java/com/dsh/android/EngineManager.kt
          MUI=$(tr -d ' \r\n' < tools/mobile-ui-version.txt)
          echo "mobile-ui target = $MUI"
          case "$MUI" in
            1.1.0-[0-9]*) : ;;
            *) echo '::error::tools/mobile-ui-version.txt 格式应为 1.1.0-<数字>'; exit 1 ;;
          esac
          sed -i -E "s/MOBILE_UI_VERSION = \"[0-9.]+-[0-9]+\"/MOBILE_UI_VERSION = \"$MUI\"/" "$EM"
          grep -n 'MOBILE_UI_VERSION' "$EM" | head -3
          grep -q "MOBILE_UI_VERSION = \"$MUI\"" "$EM" || { echo '::error::MOBILE_UI_VERSION 未按 tools/mobile-ui-version.txt 写入'; exit 1; }
          grep -q '__mpDrawerFixV5' mobile-ui-plugin/dsh-android-mobile/lib/client.js && echo 'OK client.js 带 v5 侧栏补丁' || { echo '::error::client.js 缺少 __mpDrawerFixV5'; exit 1; }

      - name: 现场打包插件资产（15 个 zip）
        run: bash tools/build-plugin-assets.sh

      - name: 校验 mobile-ui.zip 带单一入口补丁（__mpDrawerFixV5）
        run: |
          set -e
          Z=app/src/main/assets/mobile-ui.zip
          [ -s "$Z" ] || { echo "::error::mobile-ui.zip 未生成"; exit 1; }
          unzip -p "$Z" 'lib/client.js' > /tmp/cj.js
          grep -q '__mpDrawerFixV5' /tmp/cj.js || { echo '::error::mobile-ui.zip 缺少 __mpDrawerFixV5'; exit 1; }
          if grep -q '__mpDrawerFix170' app/src/main/assets/webview-polyfill.js; then echo '::error::webview-polyfill.js 仍含旧补丁'; exit 1; fi
          ls -l /tmp/cj.js "$Z"

      - name: 工具链自检
        run: |
          java -version
          bash ./gradlew --version --console=plain | sed -n '1,12p'
          echo "ASSETS_TAG=${ASSETS_TAG:-<none>}"

      - name: JS 语法门禁（插件前端必须能被解析）
        run: |
          node --check mobile-ui-plugin/dsh-android-mobile/lib/client.js
          node --check tools/ui-contract/audit.mjs
          node --check tools/ui-contract/extract.mjs
          node --check mobile-ui-plugin/dsh-android-mobile/lib/drawer-fix-170.js
          node --check app/src/main/assets/webview-polyfill.js

      - name: UI 契约门禁（哈希类名不许增加 / 不许死引用）
        run: |
          node tools/ui-contract/audit.mjs --dead
          node tools/ui-contract/audit.mjs --max 67

      - name: 编译门禁（engine 包，不需要资产）
        run: KTCACHE="$HOME/.kt" bash tools/verify-engine.sh

      - name: 版本戳（读 tools/app-version.txt 与模板）
        run: |
          set -e
          V_NAME=$(grep '^versionName=' tools/app-version.txt | cut -d= -f2 | tr -d ' \r\n')
          V_CODE=$(grep '^versionCode=' tools/app-version.txt | cut -d= -f2 | tr -d ' \r\n')
          echo "Target Version: versionName=$V_NAME, versionCode=$V_CODE"
          [ -n "$V_NAME" ] && [ -n "$V_CODE" ] || { echo "::error::tools/app-version.txt 配置无效"; exit 1; }

          # 动态匹配任意旧值，写入新版本号
          sed -i -E "s/versionCode = [0-9]+/versionCode = $V_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$V_NAME\"/" app/build.gradle.kts

          CL_FILE="docs/changelog/${V_NAME}.md"
          if grep -q "^## \[${V_NAME}\]" CHANGELOG.md; then
            echo "CHANGELOG 已含 $V_NAME 小节，跳过注入"
          elif [ -f "$CL_FILE" ]; then
            { cat "$CL_FILE"; cat CHANGELOG.md; } > CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md
            echo "CHANGELOG 已注入 $V_NAME 小节（模板：$CL_FILE）"
          else
            echo "::warning::未找到 $CL_FILE，跳过 CHANGELOG 注入"
          fi
          head -4 CHANGELOG.md
          grep -n 'versionCode = \|versionName = ' app/build.gradle.kts
          sh tools/version.sh --check

      - name: 生成无线调试 adb 工具链（S5）
        run: bash tools/build-adb-wireless.sh

      - name: 构建 APK
        run: bash ./gradlew :app:assembleSystemDebug --console=plain --stacktrace

      - name: APK 资产断言（单运行时）
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/system/debug/*.apk | head -1)
          echo "APK=$APK"
          python3 tools/check-apk-assets.py "$APK"

      - name: 产物清单
        if: always()
        run: |
          echo '--- apk ---'
          find app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null || echo '(no apk)'
          echo '--- 资产体积 ---'
          du -sh app/src/main/assets || true
          ls -lh app/src/main/assets/*.bin 2>/dev/null || true

      - name: 上传 APK（Actions artifact，内部）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-system-debug
          path: |
            app/build/outputs/apk/system/debug/*.apk
            app/build/outputs/apk/system/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 Release（公开可下）
        # 只有 main 的构建能发布。PR 构建也曾走到这里，把 v0.4.4-test 的资产
        # 覆盖成 PR 代码（2026-11-12 实际发生），所以这里同时挡 event 与 ref。
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/system/debug -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no apk found"; exit 1; }
          NAME="dsh-android-0.4.4-test-arm64.apk"
          cp -f "$APK" "/tmp/$NAME"
          SHA=$(sha256sum "/tmp/$NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "/tmp/$NAME")
          NODE=$(grep -oE 'NODE_EXECUTABLE_VERSION = "v[0-9.]+"' app/src/main/java/com/dsh/android/termux/TermuxBootstrap.kt | grep -oE 'v[0-9.]+' | head -1 || true)
          MUI=$(grep -oE 'MOBILE_UI_VERSION = "[0-9.]+-[0-9]+"' app/src/main/java/com/dsh/android/EngineManager.kt | grep -oE '[0-9.]+-[0-9]+' | head -1 || true)
          echo "APK=$APK -> /tmp/$NAME size=$SIZE sha256=$SHA node=${NODE:-?} mobile-ui=${MUI:-?}"
          NOTES=$(printf 'engine @deepseek-ai/dsh@0.2.2-rc.1\n\n- versionName **0.4.4-test** / versionCode **50**\n- apk size `%s` bytes\n- sha256 `%s`\n- node runtime `%s` (constants aligned, wrapper included)\n- mobile-ui `%s` (seat scope + lead button in header + single icon + settings z=1200)\n- assets: engine.bin / node-runtime.bin / bootstrap-aarch64.zip\n' "$SIZE" "$SHA" "${NODE:-?}" "${MUI:-?}")
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release edit "$REL_TAG" --notes "$NOTES" || true
          else
            gh release create "$REL_TAG" --title "DSH Android 0.4.4-test（PRoot 单运行时 / vc=50）" --notes "$NOTES"
          fi
          gh release upload "$REL_TAG" "/tmp/$NAME" --clobber
          echo '--- assets ---'
          gh release view "$REL_TAG" --json assets -q '.assets[] | "\(.name) \(.size) \(.state)"'

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7

# ui-contract: 78 修复已验证，本行仅用于触发一次完整构建
