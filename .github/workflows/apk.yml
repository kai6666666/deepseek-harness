name: 构建 APK（x86_64 runner）

# 为什么必须在这里构建：本机是 arm64，Google 的 build-tools 只发 x86_64 二进制
# （d8 / zipalign / apksigner 没有 linux-arm64 版本），所以本机只能配置工程、
# 编 Kotlin（见 ci.yml 的 engine-compile），出包交给 ubuntu-latest。
#
# 资产不入库（约 135 MB）。把它们打成一个 Release 附件 dsh-assets.zip，
# 本工作流会下载并铺到 app/src/main/assets/；Release 不存在时**照样出包**，
# 只是 APK 里没有引擎（装上能开界面，启动引擎会报缺资产）。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'bundle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/apk.yml'
      - 'tools/ci-fetch-assets.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_release:
        description: '存放构建资产的 Release tag（留空则用仓库变量 ASSETS_RELEASE，再空则跳过资产）'
        required: false
        default: ''
      strict_assets:
        description: '资产缺失时直接失败（1）而不是降级出包（0）'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assembleSystemDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETS_TAG: ${{ github.event.inputs.assets_release || vars.ASSETS_RELEASE }}
      STRICT_ASSETS: ${{ github.event.inputs.strict_assets || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Android SDK（platform 35 + build-tools 35）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: 铺构建资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci-fetch-assets.sh

      - name: 工具链自检
        run: |
          java -version
          ./gradlew --version --console=plain | sed -n '1,12p'
          echo "ASSETS_TAG=${ASSETS_TAG:-<none>}"

      - name: 编译门禁（engine 包，不需要资产）
        run: KTCACHE="$HOME/.kt" bash tools/verify-engine.sh

      - name: 构建 APK
        run: ./gradlew :app:assembleSystemDebug --console=plain --stacktrace

      - name: 产物清单
        if: always()
        run: |
          echo '--- apk ---'
          find app/build/outputs -name '*.apk' -exec ls -lh {} \;
          echo '--- 资产体积 ---'
          du -sh app/src/main/assets || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-system-debug
          path: |
            app/build/outputs/apk/system/debug/*.apk
            app/build/outputs/apk/system/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
