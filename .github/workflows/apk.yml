name: 构建 APK（x86_64 runner）

# 为什么必须在这里构建：本机是 arm64，Google 的 build-tools 只发 x86_64 二进制
# （d8 / zipalign / apksigner 没有 linux-arm64 版本），所以本机只能配置工程、
# 编 Kotlin（见 ci.yml 的 engine-compile），出包交给 ubuntu-latest。
#
# 资产不入库。没有 Release 时，工作流现场自建：
#   engine.bin（npm）· node-runtime.bin（Termux deb）· 三个 C 适配层（NDK）· pnpm

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'bundle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/apk.yml'
      - 'tools/ci-fetch-assets.sh'
      - 'tools/build-engine-bin.sh'
      - 'tools/build-node-runtime.sh'
      - 'tools/build-native-assets.sh'
      - 'tools/build-plugin-assets.sh'
      - 'tools/build-node-pty.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_release:
        description: '存放构建资产的 Release tag（留空则读 vars.ASSETS_RELEASE，再空则现场自建）'
        required: false
        default: ''
      strict_assets:
        description: '1 = 缺资产就失败；0 = 降级出包'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assembleSystemDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETS_TAG: ${{ github.event.inputs.assets_release || vars.ASSETS_RELEASE }}
      STRICT_ASSETS: ${{ github.event.inputs.strict_assets || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Android SDK（platform 35 + build-tools 35 + NDK 27）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: true

      - name: 修可执行位（仓库从 Android 文件系统提交，没带 +x）
        run: chmod +x gradlew tools/*.sh || true

      - name: 铺构建资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci-fetch-assets.sh

      - name: 现场构建 engine.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          VER=0.2.1-rc.3 OUT="$GITHUB_WORKSPACE/app/src/main/assets/engine.bin" \
            bash tools/build-engine-bin.sh

      - name: 现场构建 node-runtime.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/node-runtime.bin" \
            bash tools/build-node-runtime.sh

      - name: 现场构建原生产物 + pnpm
        run: bash tools/build-native-assets.sh

      - name: 现场打包插件资产（15 个 zip）
        run: bash tools/build-plugin-assets.sh

      # node-pty 没有 android 预编译二进制，用 NDK 从它自带的 src/unix/pty.cc 现编。
      # -static-libstdc++ 是硬要求：动态链会拉 libc++_shared.so，Termux 里没有。
      - name: 现场编 node-pty 绑定
        run: bash tools/build-node-pty.sh

      - name: 工具链自检
        run: |
          java -version
          bash ./gradlew --version --console=plain | sed -n '1,12p'
          echo "ASSETS_TAG=${ASSETS_TAG:-<none>}"

      - name: 编译门禁（engine 包，不需要资产）
        run: KTCACHE="$HOME/.kt" bash tools/verify-engine.sh

      - name: 构建 APK
        run: bash ./gradlew :app:assembleSystemDebug --console=plain --stacktrace

      - name: 产物清单
        if: always()
        run: |
          echo '--- apk ---'
          find app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null || echo '(no apk)'
          echo '--- 资产体积 ---'
          du -sh app/src/main/assets || true
          ls -lh app/src/main/assets/*.bin 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-system-debug
          path: |
            app/build/outputs/apk/system/debug/*.apk
            app/build/outputs/apk/system/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
