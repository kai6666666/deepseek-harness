name: 构建 APK（x86_64 runner）

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'bundle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/apk.yml'
      - 'tools/ci-fetch-assets.sh'
      - 'tools/build-engine-bin.sh'
      - 'tools/build-node-runtime.sh'
      - 'tools/node-runtime-wrap.sh'
      - 'tools/build-native-assets.sh'
      - 'tools/build-plugin-assets.sh'
      - 'tools/build-node-pty.sh'
      - 'tools/build-extra-native.sh'
      - 'tools/build-node-addon-system.sh'
      - 'tools/build-webview_compat.py'
      - 'tools/build-node-addon-require-builtin.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_release:
        description: '存放构建资产的 Release tag（留空则读 vars.ASSETS_RELEASE，再空则现场自建）'
        required: false
        default: ''
      strict_assets:
        description: '1 = 缺资产就失败；0 = 降级出包'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assembleSystemDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETS_TAG: ${{ github.event.inputs.assets_release || vars.ASSETS_RELEASE }}
      STRICT_ASSETS: ${{ github.event.inputs.strict_assets || '0' }}
      REL_TAG: v0.4.3-debug
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-


      - name: Android SDK（platform 35 + build-tools 35 + NDK 27）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: true

      - name: 修可执行位（仓库从 Android 文件系统提交，没带 +x）
        run: chmod +x gradlew tools/*.sh || true

      - name: 铺构建资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci-fetch-assets.sh

      - name: 现场构建 engine.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          VER=0.2.2-rc.1 OUT="$GITHUB_WORKSPACE/app/src/main/assets/engine.bin" \
            bash tools/build-engine-bin.sh

      - name: 现场构建 node-runtime.bin（无 Release 时）
        if: env.ASSETS_TAG == ''
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/node-runtime.bin" \
            bash tools/build-node-runtime.sh

      # node 入口包装：吃掉 --no-open（否则引擎不打印 URL，App 等不到就 kill）
      # + 启动时补 /data/data/<pkg>/usr|home 符号链接（node 的 RUNPATH 指向它）
      - name: node-runtime 包装（node 入口）
        run: |
          set -e
          A=app/src/main/assets/node-runtime.bin
          if [ ! -s "$A" ]; then echo '::warning title=node-wrap::no node-runtime.bin, skip'; exit 0; fi
          bash tools/node-runtime-wrap.sh "$A"
          unzip -l "$A" | grep -q 'bin/node.real' && echo 'OK bin/node.real'
          unzip -p "$A" bin/node | grep -q '__DSH_NODE_WRAP__' && echo 'OK wrapper'

      - name: 现场取 Termux bootstrap（bootstrap-aarch64.zip）
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/bootstrap-aarch64.zip" \
            bash tools/build-bootstrap.sh

      - name: 现场构建原生产物 + pnpm
        run: bash tools/build-native-assets.sh

      # 补丁已迁到 app/src/main/assets/webview-polyfill.js（App 资产通道）。
      # 这里只负责把版本戳推到 1.1.0-174，让设备重解包一份干净的 client.js。
      - name: mobile-ui 版本戳 1.1.0-174（补丁在 webview-polyfill）
        run: |
          set -e
          EM=app/src/main/java/com/dsh/android/EngineManager.kt
          sed -i 's/MOBILE_UI_VERSION = "1\.1\.0-169"/MOBILE_UI_VERSION = "1.1.0-174"/' "$EM"
          grep -n 'MOBILE_UI_VERSION' "$EM" | head -3
          grep -q 'MOBILE_UI_VERSION = "1.1.0-174"' "$EM" || { echo '::error::MOBILE_UI_VERSION not bumped'; exit 1; }
          grep -q '__mpDrawerFix170' app/src/main/assets/webview-polyfill.js && echo 'OK polyfill 带补丁' || { echo '::error::polyfill 没带补丁'; exit 1; }

      - name: 现场打包插件资产（15 个 zip）
        run: bash tools/build-plugin-assets.sh

      - name: 校验 mobile-ui.zip 是干净的（补丁只在 polyfill）
        run: |
          set -e
          Z=app/src/main/assets/mobile-ui.zip
          [ -s "$Z" ] || { echo "::error::mobile-ui.zip 未生成"; exit 1; }
          unzip -p "$Z" 'lib/client.js' > /tmp/cj.js
          if grep -q '__mpDrawerFix170' /tmp/cj.js; then echo '::error::client.js 仍含补丁（应已迁到 polyfill）'; exit 1; fi
          ls -l /tmp/cj.js "$Z"

      - name: 现场编 node-pty 绑定
        run: bash tools/build-node-pty.sh

      - name: 现场构建 sharp / ripgrep / adb
        run: bash tools/build-extra-native.sh

      - name: 现场编 node-addon-system（flock 绑定）
        if: env.ASSETS_TAG == ''
        run: bash tools/build-node-addon-system.sh

      - name: node-addon-require-builtin（插槽）
        if: env.ASSETS_TAG == ''
        run: bash tools/build-node-addon-require-builtin.sh

      - name: 预装 acorn
        run: npm i --no-save --no-audit --no-fund acorn@8

      - name: 现场生成 webview-compat
        if: env.ASSETS_TAG == ''
        run: |
          if [ -f tools/build-webview_compat.py ]; then
            python3 tools/build-webview_compat.py --engine /tmp/dsh-engine-0.2.2-rc.1
          else
            echo "::notice::tools/build-webview_compat.py 不在仓库里，跳过"
          fi

      - name: 资产闸门（engine / node-runtime / bootstrap）
        run: |
          a=app/src/main/assets
          miss=0
          for f in engine.bin node-runtime.bin bootstrap-aarch64.zip; do
            if [ -s "$a/$f" ]; then
              echo "OK  $f $(du -h "$a/$f" | cut -f1)"
            else
              echo "::error::缺少关键资产 $f -- 这个包装到真机上引擎起不来"
              miss=1
            fi
          done
          exit $miss

      - name: Node 运行时版本对齐
        run: |
          set -u
          ASSET=app/src/main/assets/node-runtime.bin
          KT=app/src/main/java/com/dsh/android/termux/TermuxBootstrap.kt
          if [ ! -s "$ASSET" ]; then
            echo "::warning title=node-align::no node-runtime.bin (assets from Release), skip"
            exit 0
          fi
          rm -rf /tmp/nrx && mkdir -p /tmp/nrx
          if ! unzip -o -q "$ASSET" bin/node.real -d /tmp/nrx; then
            if ! unzip -o -q "$ASSET" bin/node -d /tmp/nrx; then
              echo "::warning title=node-align::cannot unzip node, skip"
              exit 0
            fi
          fi
          NB=/tmp/nrx/bin/node.real
          [ -f "$NB" ] || NB=/tmp/nrx/bin/node
          REAL=$(strings -a "$NB" | grep -oE 'v26\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$REAL" ]; then
            echo "::warning title=node-align::cannot read node version, skip"
            exit 0
          fi
          echo "bundled node version: $REAL"
          sed -i "s/private const val NODE_EXECUTABLE_VERSION = \"v[0-9.]*\"/private const val NODE_EXECUTABLE_VERSION = \"$REAL\"/" "$KT"
          sed -i "s/private const val NODE_VERSION = \"[0-9.-]*\"/private const val NODE_VERSION = \"${REAL#v}-1\"/" "$KT"
          grep -n 'NODE_EXECUTABLE_VERSION = \|NODE_VERSION = ' "$KT" | head -4
          grep -q "NODE_EXECUTABLE_VERSION = \"$REAL\"" "$KT" || { echo "::error::node version constants not aligned"; exit 1; }

      - name: 工具链自检
        run: |
          java -version
          bash ./gradlew --version --console=plain | sed -n '1,12p'
          echo "ASSETS_TAG=${ASSETS_TAG:-<none>}"

      - name: 编译门禁（engine 包，不需要资产）
        run: KTCACHE="$HOME/.kt" bash tools/verify-engine.sh

      - name: 版本戳 0.4.3-debug（vc=48）
        run: |
          sed -i 's/versionCode = 47/versionCode = 48/' app/build.gradle.kts
          sed -i 's/versionName = "0.2.2-rc1"/versionName = "0.4.3-debug"/' app/build.gradle.kts
          python3 -c "import pathlib;c=pathlib.Path('CHANGELOG.md');t=c.read_text(encoding='utf-8');b='## [0.4.3-debug] — 2026-11-07\nvc=48\n\n### 变更\n\n- 引擎 `@deepseek-ai/dsh` 0.2.2-rc.1；锚点门禁：官方 5/5、EngineManager 13 对 *_GUARD 13/13。\n- versionName **0.4.3-debug** / versionCode **48**。\n- 补回 apk.yml 缺失的 Termux bootstrap 步骤 + 三件套资产闸门。\n- Node 运行时版本对齐（从包内 bin/node 回写 NODE_EXECUTABLE_VERSION / NODE_VERSION）。\n- **node 入口包装**：node-runtime.bin 内含 bin/node(wrapper)+bin/node.real，启动时补 usr/home 符号链接并吞掉 --no-open（引擎才会打印 URL）。\n- **mobile-ui 1.1.0-173**：设置弹窗抬到 z=1200 + 模态挂载即收抽屉 + 清残留 .mp-drawer-mask；左按钮仅在会话视图改用 header 布局（15px、与右侧同一串类名），面板页保留官方座位；多模态配置按 dsh-market 做法去掉自定义标记。\n\n---\n\n';c.write_text((b+t) if '## [0.4.3-debug]' not in t else t,encoding='utf-8')"
          grep -n 'versionCode = \|versionName = ' app/build.gradle.kts
          sh tools/version.sh --check

      - name: 构建 APK
        run: bash ./gradlew :app:assembleSystemDebug --console=plain --stacktrace

      - name: 产物清单
        if: always()
        run: |
          echo '--- apk ---'
          find app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null || echo '(no apk)'
          echo '--- 资产体积 ---'
          du -sh app/src/main/assets || true
          ls -lh app/src/main/assets/*.bin 2>/dev/null || true

      - name: 上传 APK（Actions artifact，内部）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-system-debug
          path: |
            app/build/outputs/apk/system/debug/*.apk
            app/build/outputs/apk/system/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 Release（公开可下）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/system/debug -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no apk found"; exit 1; }
          NAME="dsh-android-0.4.3-debug-arm64.apk"
          cp -f "$APK" "/tmp/$NAME"
          SHA=$(sha256sum "/tmp/$NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "/tmp/$NAME")
          NODE=$(grep -oE 'NODE_EXECUTABLE_VERSION = "v[0-9.]+"' app/src/main/java/com/dsh/android/termux/TermuxBootstrap.kt | grep -oE 'v[0-9.]+' | head -1 || true)
          MUI=$(grep -oE 'MOBILE_UI_VERSION = "[0-9.]+-[0-9]+"' app/src/main/java/com/dsh/android/EngineManager.kt | grep -oE '[0-9.]+-[0-9]+' | head -1 || true)
          echo "APK=$APK -> /tmp/$NAME size=$SIZE sha256=$SHA node=${NODE:-?} mobile-ui=${MUI:-?}"
          NOTES=$(printf 'engine @deepseek-ai/dsh@0.2.2-rc.1\n\n- versionName **0.4.3-debug** / versionCode **48**\n- apk size `%s` bytes\n- sha256 `%s`\n- node runtime `%s` (constants aligned, wrapper included)\n- mobile-ui `%s` (seat scope + lead button in header + single icon + settings z=1200)\n- assets: engine.bin / node-runtime.bin / bootstrap-aarch64.zip\n' "$SIZE" "$SHA" "${NODE:-?}" "${MUI:-?}")
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release edit "$REL_TAG" --notes "$NOTES" --prerelease || true
          else
            gh release create "$REL_TAG" --title "0.4.3-debug (engine 0.2.2-rc.1 / vc=48)" --notes "$NOTES" --prerelease
          fi
          gh release upload "$REL_TAG" "/tmp/$NAME" --clobber
          echo '--- assets ---'
          gh release view "$REL_TAG" --json assets -q '.assets[] | "\(.name) \(.size) \(.state)"'

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
