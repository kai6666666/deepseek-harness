name: 编译检查（Kotlin）

# 只为快速反馈：不带构建资产、不出包，只跑 Kotlin 编译。
# 出包与真机验收仍由 apk.yml 负责。
on:
  pull_request:
    paths:
      - 'app/**/*.kt'
      - 'app/*.gradle.kts'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: :app:compileSystemDebugKotlin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK（platform 35 + build-tools 35）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: compile-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: compile-gradle-

      - name: 修可执行位
        run: chmod +x gradlew || true
      - name: 编译与 S6 回归测试
        run: |
          set -o pipefail
          ./gradlew :app:compileSystemDebugKotlin :app:testSystemDebugUnitTest --console=plain --no-daemon 2>&1 | tee /tmp/build.log

      # jobs/logs 接口对本仓库 token 恒 401，所以失败信息只能自己搬出来：
      # ① 用 ::error:: 变成 annotation（check-runs/{id}/annotations 可读）；
      # ② 全量日志作为 artifact（配合 artifact 的 302 直取）。
      - name: 编译错误摘要（annotation 通道）
        if: failure()
        run: |
          echo '--- kotlin errors ---'
          grep -nE '^e: |error:|FAILURE: Build|Caused by:' /tmp/build.log | head -40 || true
          grep -nE '^e: |error:|FAILED|Caused by: ' /tmp/build.log | grep -v 'BUILD FAILED' | head -40 | while IFS= read -r line; do
            echo "::error title=Kotlin::${line}"
          done || true
          echo '--- tail ---'
          tail -40 /tmp/build.log || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: /tmp/build.log
          if-no-files-found: warn
          retention-days: 7
      - name: S6 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-unit-tests
          path: app/build/test-results/testSystemDebugUnitTest/

