name: proot-android

# G-23：在云端把 proot 交叉编译成 aarch64 + bionic，
# 产出可直接放进 app/src/main/jniLibs/arm64-v8a/libproot.so 的二进制。
#
# 为什么不在本机做：没有 NDK，也没有能跑 aarch64 链接器的主机。
# 为什么不用 Termux 现成的：它的 RUNPATH 写死 /data/data/com.termux/…，与本 App 私有目录不等长。

on:
  workflow_dispatch:
    inputs:
      api:
        description: "Android API level（proot 用 24 足够）"
        required: false
        default: "24"
  push:
    paths:
      - "tools/proot/**"
      - ".github/workflows/proot-android.yml"

permissions:
  contents: read

concurrency:
  group: proot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境（NDK / 编译器 / python）
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK/ndk" 2>/dev/null || echo "(no ndk dir)"
          ls "$SDK/ndk"/*/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android*-clang 2>/dev/null | head -3 || true
          python3 -V
          nproc

      - name: 安装 binutils（readelf / strings 摘要要用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils file >/dev/null

      - name: 交叉编译 proot
        env:
          API: ${{ inputs.api || '24' }}
        run: |
          set -uo pipefail
          chmod +x tools/proot/build-proot-android.sh
          bash tools/proot/build-proot-android.sh --out dist --api "$API" --jobs "$(nproc)" 2>&1 | tee proot.log
          rc=${PIPESTATUS[0]}
          echo "build exit=$rc"
          exit "$rc"

      - name: 产物摘要
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/proot.info 2>/dev/null | head -40 >> "$GITHUB_STEP_SUMMARY" || echo "(no info)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l dist 2>/dev/null || true
          echo "=== 错误摘要（如果有）==="
          grep -nE "error:|undefined reference|No such file|✗" proot.log 2>/dev/null | head -30 || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libproot-android
          path: |
            dist/libproot.so
            dist/libproot-loader.so
            dist/LOADER_EMBEDDED
            dist/proot.info
            proot.log
          retention-days: 30
          if-no-files-found: warn