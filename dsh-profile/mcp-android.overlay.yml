# deepseek harness / DSH 侧 MCP 桥
#
# 用法（在容器的 DSH_HOME 里）：
#   dsh web --patch /root/dsh-android.overlay.yml
# 或把下面两行并进 profile 的 cordis.yml。
#
# 模型看到的工具名：
#   mcp__android__tap
#   mcp__android__swipe
#   mcp__android__screenshot
#   mcp__android__ui_dump
#
# 前提：APP 已安装且前台服务在跑（MCP server 监听 127.0.0.1:8765），
#       屏幕类工具还需要用户在系统设置里打开无障碍开关。

- id: mcp-android
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: android
    transport: streamable-http
    url: http://127.0.0.1:8765/mcp
    toolCallTimeoutMs: 30000
    failOnStartupError: false
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 5000
      maxAttempts: 50