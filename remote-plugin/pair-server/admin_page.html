<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DSH 授权管理</title>
<style>
:root{
  --bg:#0d0f12; --card:#14171c; --card2:#191d24; --line:#232830;
  --fg:#e8eaed; --dim:#868e9c; --faint:#5c6472;
  --accent:#4c8dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px 96px;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

header{display:flex;align-items:center;justify-content:space-between;
  padding:30px 0 22px;border-bottom:1px solid var(--line);margin-bottom:32px;}
header h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.3px;}
header .sub{color:var(--faint);font-size:12.5px;margin-top:3px;}
header .right{display:flex;align-items:center;gap:14px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;
  background:var(--faint);vertical-align:1px;}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.14);}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(248,81,73,.14);}
.health{color:var(--dim);font-size:12.5px;}

section{margin-bottom:34px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.sec-head h2{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:var(--faint);margin:0;}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.stat .k{color:var(--dim);font-size:12.5px;margin-bottom:6px;}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.1;}
.stat .v.ok{color:var(--ok);} .stat .v.warn{color:var(--warn);} .stat .v.bad{color:var(--bad);}

/* 表单 */
.form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 18px;}
input,select,button{font:inherit;color:var(--fg);}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:7px;
  padding:9px 12px;outline:none;transition:border-color .15s;}
input:focus,select:focus{border-color:#3a4557;}
input::placeholder{color:var(--faint);}
#note{flex:1 1 260px;min-width:180px;}
#count{width:78px;}
button{background:var(--card2);border:1px solid var(--line);border-radius:7px;
  padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s;
  white-space:nowrap;}
button:hover{background:#1f242c;border-color:#2f3948;}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
button.primary:hover{background:#3d7de8;border-color:#3d7de8;}
button:disabled{opacity:.45;cursor:not-allowed;}

/* 表格 */
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;letter-spacing:.6px;
  text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid #1b2026;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#11151a;}
td.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.6px;font-size:12.5px;cursor:pointer;}
td.code:hover{color:var(--accent);}
.muted{color:var(--faint);}

.badge{display:inline-block;padding:2.5px 9px;border-radius:999px;font-size:11.5px;
  border:1px solid transparent;line-height:1.5;white-space:nowrap;}
.badge.registered{color:var(--ok);background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.22);}
.badge.unused{color:var(--dim);background:rgba(134,142,156,.09);border-color:rgba(134,142,156,.2);}
.badge.revoked{color:var(--bad);background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.22);}
.badge.legacy{color:var(--warn);background:rgba(210,153,34,.1);border-color:rgba(210,153,34,.22);}

td.ops{white-space:nowrap;text-align:right;}
td.ops button{padding:5px 11px;font-size:12px;margin-left:6px;border-radius:6px;}
button.danger{color:#ff8a84;}
button.danger:hover{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.35);}

/* 新生成结果 */
#created{margin-top:14px;padding:16px 18px;border-radius:10px;
  background:rgba(76,141,255,.07);border:1px solid rgba(76,141,255,.25);display:none;}
#created .hint{color:var(--dim);font-size:12.5px;margin-bottom:10px;}
#created .codes{display:flex;flex-wrap:wrap;gap:10px;}
#created .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px;letter-spacing:1.4px;padding:8px 14px;border-radius:7px;
  background:#0b0e12;border:1px solid #2a3140;cursor:pointer;}
#created .c:hover{border-color:var(--accent);color:var(--accent);}

/* 隧道卡 */
.tun{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tun .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.tun .row{display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px solid #1b2026;font-size:13px;}
.tun .row:last-child{border-bottom:none;}
.tun .row .k{color:var(--dim);}
.tun .row .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;}

/* 登录 */
#login{max-width:380px;margin:70px auto 0;}
#login .card{padding:28px;}
#login h2{font-size:16px;margin:0 0 6px;font-weight:600;}
#login p{color:var(--dim);font-size:13px;margin:0 0 20px;}
#login input{width:100%;margin-bottom:12px;}
#login button{width:100%;}

.msg{margin-top:12px;font-size:13px;min-height:20px;}
.msg.err{color:var(--bad);}
.msg.ok{color:var(--ok);}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);
  background:#1c222b;border:1px solid #2c3542;color:var(--fg);padding:10px 18px;
  border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:99;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#main{display:none;}
.empty{padding:44px 0;text-align:center;color:var(--faint);font-size:13px;}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .tun{grid-template-columns:1fr;}
  header{flex-wrap:wrap;gap:10px;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>DSH 授权管理</h1>
      <div class="sub">激活码 · 已配对设备 · 隧道状态</div>
    </div>
    <div class="right" id="hdrRight" style="display:none">
      <div class="health"><span class="dot" id="hdrDot"></span><span id="hdrText">未连接</span></div>
      <button id="btnLogout">退出</button>
    </div>
  </header>

  <div id="login">
    <div class="card">
      <h2>管理口令</h2>
      <p>输入服务器上的 <span class="mono">PAIR_ADMIN_SECRET</span>。口令只存在本浏览器标签页，关闭即失效。</p>
      <input id="secret" type="password" placeholder="管理口令" autocomplete="current-password">
      <button class="primary" id="btnLogin">进入</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div id="main">
    <section>
      <div class="stats">
        <div class="stat"><div class="k">激活码总数</div><div class="v num" id="sTotal">–</div></div>
        <div class="stat"><div class="k">已注册</div><div class="v num ok" id="sReg">–</div></div>
        <div class="stat"><div class="k">未使用</div><div class="v num" id="sUnused">–</div></div>
        <div class="stat"><div class="k">已停用 / 待迁移</div><div class="v num bad" id="sBad">–</div></div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>生成激活码</h2></div>
      <div class="card">
        <div class="form">
          <input id="note" placeholder="备注（发给了谁 / 哪一批），可留空">
          <input id="count" class="num" type="number" min="1" max="50" value="1">
          <button class="primary" id="btnNew">生成</button>
          <button id="btnRefresh">刷新列表</button>
        </div>
        <div id="created"></div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>激活码</h2><span class="health" id="listHint"></span></div>
      <div class="card tablewrap">
        <table>
          <thead>
            <tr>
              <th>激活码</th><th>状态</th><th>备注</th><th>设备</th>
              <th>最近领取</th><th style="text-align:right">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">还没有激活码，先在上面生成一个。</div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>隧道</h2><button id="btnTunnel">重新检测</button></div>
      <div class="tun">
        <div class="box" id="tunServer"></div>
        <div class="box" id="tunClients"></div>
      </div>
    </section>
  </div>

</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  var KEY = 'dsh-admin-secret';
  var secret = '';
  var lastCodes = [];

  function $(id) { return document.getElementById(id); }

  function toast(text) {
    var t = $('toast');
    t.textContent = text;
    t.className = 'show';
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.className = ''; }, 1900);
  }

  /**
   * 调管理接口。
   *
   * ⚠️ 所有管理接口都要 `X-Pair-Admin` 头 —— 服务端用 `hmac.compare_digest`
   * 比它，前端只是携带，不做任何本地判断（本地判断等于没有判断）。
   */
  function api(path, opts) {
    opts = opts || {};
    var headers = { 'X-Pair-Admin': secret };
    var body;
    if (opts.body !== undefined) {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(opts.body);
    }
    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      body: body,
      cache: 'no-store'
    }).then(function (res) {
      return res.text().then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
        if (!res.ok) {
          var err = new Error(data.message || data.error || ('HTTP ' + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function fmtTime(epoch) {
    if (!epoch) return null;
    var d = new Date(epoch * 1000);
    if (isNaN(d.getTime())) return null;
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  var STATE_TEXT = {
    registered: '已注册', unused: '未使用', revoked: '已停用', legacy: '待迁移'
  };

  function cell(tr, text, cls) {
    var td = document.createElement('td');
    if (text !== null && text !== undefined && text !== '') td.textContent = text;
    else { td.textContent = '—'; td.className = 'muted'; }
    if (cls) td.className = (td.className ? td.className + ' ' : '') + cls;
    tr.appendChild(td);
    return td;
  }

  function render(list) {
    lastCodes = list || [];
    var rows = $('rows');
    rows.textContent = '';

    var reg = 0, unused = 0, bad = 0;
    lastCodes.forEach(function (item) {
      if (item.state === 'registered') reg++;
      else if (item.state === 'unused') unused++;
      else bad++;
    });
    $('sTotal').textContent = lastCodes.length;
    $('sReg').textContent = reg;
    $('sUnused').textContent = unused;
    $('sBad').textContent = bad;
    $('empty').style.display = lastCodes.length ? 'none' : 'block';

    lastCodes.forEach(function (item) {
      var tr = document.createElement('tr');

      // 激活码：点一下复制
      var tdCode = document.createElement('td');
      tdCode.className = 'code';
      tdCode.textContent = item.code;
      tdCode.title = '点击复制';
      tdCode.addEventListener('click', function () {
        copy(item.code);
      });
      tr.appendChild(tdCode);

      var tdState = document.createElement('td');
      var b = document.createElement('span');
      b.className = 'badge ' + item.state;
      b.textContent = STATE_TEXT[item.state] || item.state;
      tdState.appendChild(b);
      tr.appendChild(tdState);

      cell(tr, item.note);
      cell(tr, item.deviceLabel || item.hostname);

      var when = fmtTime(item.lastClaimAt);
      cell(tr, when ? when + (item.claimCount ? ' · ' + item.claimCount + ' 次' : '') : null);

      // 操作
      var tdOps = document.createElement('td');
      tdOps.className = 'ops';

      if (item.state !== 'revoked') {
        var btnRevoke = document.createElement('button');
        btnRevoke.textContent = '停用';
        btnRevoke.addEventListener('click', function () { revoke(item, true); });
        tdOps.appendChild(btnRevoke);
      } else {
        var btnRestore = document.createElement('button');
        btnRestore.textContent = '恢复';
        btnRestore.addEventListener('click', function () { revoke(item, false); });
        tdOps.appendChild(btnRestore);
      }

      if (item.state === 'registered') {
        var btnRotate = document.createElement('button');
        btnRotate.textContent = '轮换令牌';
        btnRotate.title = '旧访问令牌立即失效';
        btnRotate.addEventListener('click', function () { rotate(item); });
        tdOps.appendChild(btnRotate);

        var btnUnreg = document.createElement('button');
        btnUnreg.className = 'danger';
        btnUnreg.textContent = '注销';
        btnUnreg.title = '删隧道 + 删 DNS，激活码可再用';
        btnUnreg.addEventListener('click', function () { unregister(item); });
        tdOps.appendChild(btnUnreg);
      }

      tr.appendChild(tdOps);
      rows.appendChild(tr);
    });

    $('listHint').textContent = '共 ' + lastCodes.length + ' 条';
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制 ' + text); },
        function () { toast(text); });
    } else {
      toast(text);
    }
  }

  function loadCodes() {
    return api('/pair/admin/codes').then(function (d) { render(d.codes || []); });
  }

  function revoke(item, on) {
    var label = on ? '停用' : '恢复';
    if (!confirm('确定' + label + ' ' + item.code + ' 吗？')) return;
    api('/pair/revoke', { method: 'POST', body: { code: item.code, revoked: on } })
      .then(function () { toast(label + '成功'); return loadCodes(); })
      .catch(showErr);
  }

  function rotate(item) {
    if (!confirm('轮换 ' + item.code + ' 的访问令牌？\n\n旧令牌立即失效，那台电脑需要重新配对。')) return;
    api('/pair/rotate', { method: 'POST', body: { code: item.code } })
      .then(function (d) {
        toast('已轮换 ' + item.code);
        // 令牌只在这一次响应里能拿到，给个复制入口，别让用户错过。
        if (d && d.accessToken && navigator.clipboard) {
          navigator.clipboard.writeText(d.accessToken).catch(function () {});
          toast('已轮换，新令牌已复制到剪贴板');
        }
        return loadCodes();
      })
      .catch(showErr);
  }

  function unregister(item) {
    if (!confirm('注销 ' + item.code + '？\n\n会删除这台机器的隧道与 DNS 记录，激活码回到「未使用」状态，可以再发出去。')) return;
    api('/pair/unregister', { method: 'POST', body: { code: item.code } })
      .then(function () { toast('已注销 ' + item.code); return loadCodes(); })
      .catch(showErr);
  }

  function create() {
    var count = parseInt($('count').value, 10);
    if (!(count >= 1)) count = 1;
    if (count > 50) count = 50;
    $('btnNew').disabled = true;
    api('/pair/codes', { method: 'POST', body: { count: count, note: $('note').value } })
      .then(function (d) {
        var box = $('created');
        box.textContent = '';
        var hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = '新激活码（点击复制）：';
        box.appendChild(hint);
        var wrap = document.createElement('div');
        wrap.className = 'codes';
        (d.codes || []).forEach(function (code) {
          var el = document.createElement('div');
          el.className = 'c';
          el.textContent = code;
          el.addEventListener('click', function () { copy(code); });
          wrap.appendChild(el);
        });
        box.appendChild(wrap);
        box.style.display = 'block';
        $('note').value = '';
        toast('已生成 ' + (d.codes || []).length + ' 个');
        return loadCodes();
      })
      .catch(showErr)
      .then(function () { $('btnNew').disabled = false; });
  }

  function row(parent, k, v, cls) {
    var div = document.createElement('div');
    div.className = 'row';
    var kk = document.createElement('span');
    kk.className = 'k';
    kk.textContent = k;
    var vv = document.createElement('span');
    vv.className = 'v ' + (cls || '');
    vv.textContent = v;
    div.appendChild(kk);
    div.appendChild(vv);
    parent.appendChild(div);
  }

  function loadTunnel() {
    api('/pair/admin/tunnel').then(function (d) {
      var s = $('tunServer');
      s.textContent = '';
      var h = document.createElement('div');
      h.className = 'hint';
      h.style.cssText = 'color:var(--faint);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px';
      h.textContent = '服务器隧道';
      s.appendChild(h);
      row(s, 'cloudflared', d.tunnel.running ? '运行中' : '未运行', d.tunnel.running ? 'ok' : 'bad');
      row(s, 'tunnel id', d.tunnel.tunnelId || '—');
      row(s, '转发入口 (mux)', d.mux.running ? '运行中 :' + d.mux.port : '未运行',
        d.mux.running ? 'ok' : 'bad');
      row(s, '对外域名', d.zone || '—');

      var c = $('tunClients');
      c.textContent = '';
      var h2 = document.createElement('div');
      h2.style.cssText = h.style.cssText;
      h2.textContent = '已注册客户机';
      c.appendChild(h2);
      var t = $('tunServer');
      if (!d.clients || !d.clients.length) {
        var e = document.createElement('div');
        e.className = 'muted';
        e.style.cssText = 'padding:10px 0;font-size:13px';
        e.textContent = '还没有客户机注册。';
        c.appendChild(e);
      } else {
        d.clients.forEach(function (cl) {
          row(c, cl.code + ' · ' + (cl.deviceLabel || '未知设备'),
            cl.hostname || '—');
        });
      }
    }).catch(showErr);
  }

  function showErr(e) {
    if (e && e.status === 401) { logout(true); return; }
    toast('失败：' + (e && e.message ? e.message : e));
  }

  function enter() {
    $('login').style.display = 'none';
    $('main').style.display = 'block';
    $('hdrRight').style.display = 'flex';
    $('hdrDot').className = 'dot on';
    $('hdrText').textContent = '已连接';
    loadCodes().catch(showErr);
    loadTunnel();
  }

  function logout(expired) {
    secret = '';
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    $('main').style.display = 'none';
    $('hdrRight').style.display = 'none';
    $('login').style.display = 'block';
    $('secret').value = '';
    $('loginMsg').className = 'msg err';
    $('loginMsg').textContent = expired ? '口令已失效，请重新输入。' : '';
  }

  function login() {
    var v = $('secret').value.trim();
    if (!v) return;
    var msg = $('loginMsg');
    msg.className = 'msg';
    msg.textContent = '验证中…';
    $('btnLogin').disabled = true;
    secret = v;
    // 用一个只读管理接口验口令，验过才放进 sessionStorage。
    api('/pair/devices').then(function () {
      try { sessionStorage.setItem(KEY, v); } catch (e) {}
      msg.textContent = '';
      enter();
    }).catch(function (e) {
      secret = '';
      msg.className = 'msg err';
      msg.textContent = (e && e.status === 401) ? '口令不对。' : ('连接失败：' + (e && e.message ? e.message : e));
    }).then(function () { $('btnLogin').disabled = false; });
  }

  $('btnLogin').addEventListener('click', login);
  $('secret').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('btnLogout').addEventListener('click', function () { logout(false); });
  $('btnNew').addEventListener('click', create);
  $('btnRefresh').addEventListener('click', function () {
    loadCodes().then(function () { toast('已刷新'); }).catch(showErr);
  });
  $('btnTunnel').addEventListener('click', function () {
    loadTunnel();
    toast('已重新检测');
  });
  $('note').addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });

  // 自动恢复本标签页的口令
  (function () {
    var saved = null;
