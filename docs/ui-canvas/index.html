<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Android · 界面关系画布</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  /* ── 无限画布 ───────────────────────────────────────────────── */
  #viewport {
    position: fixed; inset: 0; overflow: hidden;
    cursor: grab;
    background-image:
      radial-gradient(circle at 1px 1px, #1e2630 1px, transparent 0);
    background-size: 40px 40px;
  }
  #viewport.dragging { cursor: grabbing; }

  #world {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  /* ── 节点 ──────────────────────────────────────────────────── */
  .node {
    position: absolute;
    width: 210px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    transition: border-color .15s, box-shadow .15s;
  }
  .node:hover { border-color: #58a6ff; box-shadow: 0 6px 28px rgba(88,166,255,.25); }
  .node.root  { border-color: #d29922; box-shadow: 0 6px 28px rgba(210,153,34,.28); }
  .node.panel { border-color: #a371f7; }

  .node .head {
    padding: 7px 10px 6px;
    background: #1c2128;
    border-bottom: 1px solid #30363d;
    font-size: 12px; font-weight: 600; color: #e6edf3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node .head .id {
    display: block; font-size: 10px; font-weight: 400;
    color: #7d8590; margin-top: 2px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .node img { display: block; width: 100%; height: auto; background: #fff; }

  /* ── 边上的标签 ─────────────────────────────────────────────── */
  .edge-label {
    position: absolute;
    transform: translate(-50%, -50%);
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 20px;
    padding: 3px 9px;
    font-size: 10.5px;
    color: #8b949e;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── HUD ───────────────────────────────────────────────────── */
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 100;
    background: rgba(22,27,34,.92);
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px 14px;
    color: #e6edf3;
    font-size: 12px;
    backdrop-filter: blur(8px);
    max-width: 300px;
  }
  #hud h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  #hud .sub { color: #7d8590; font-size: 11px; line-height: 1.6; margin-bottom: 9px; }
  #hud .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  #hud button {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer;
    font-family: inherit;
  }
  #hud button:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }
  #hud .legend { margin-top: 9px; padding-top: 9px; border-top: 1px solid #30363d; color: #7d8590; font-size: 10.5px; line-height: 1.8; }
  #hud .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #zoom { position: fixed; bottom: 14px; left: 14px; z-index: 100; color: #7d8590; font-size: 11px;
    background: rgba(22,27,34,.9); border: 1px solid #30363d; border-radius: 6px; padding: 5px 10px;
    font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>

<div id="viewport">
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="hud">
  <h1>DSH Android · 界面关系画布</h1>
  <div class="sub">
    真机采集的 <b id="cnt">19</b> 张界面截图，连线表示<b>从哪个界面点哪个按钮能到哪个界面</b>。<br>
    拖拽平移 · 滚轮缩放 · 双击节点看大图
  </div>
  <div class="btns">
    <button onclick="fitAll()">适应窗口</button>
    <button onclick="focusRoot()">回到起点</button>
    <button onclick="zoomBy(1.25)">放大</button>
    <button onclick="zoomBy(0.8)">缩小</button>
  </div>
  <div class="legend">
    <div><i style="background:#d29922"></i>起点（基态，空会话）</div>
    <div><i style="background:#a371f7"></i>全屏面板</div>
    <div><i style="background:#30363d"></i>普通界面</div>
  </div>
</div>
<div id="zoom">100%</div>

<script>
// ══════════════════════════════════════════════════════════════════════
// 数据 —— 全部来自真机采集（tools/ui-map-real-frontend.json）
// ══════════════════════════════════════════════════════════════════════

/** 每个界面的截图与标题。 */
const SHOTS = {
  'hero':                { title: '空会话（起点）',   kind: 'root'  },
  'drawer':              { title: '会话抽屉',         kind: 'panel' },
  'settings':            { title: '设置',             kind: 'panel' },
  'settings-general':    { title: '通用设置',         kind: '' },
  'settings-model':      { title: '模型',             kind: '' },
  'settings-plugins':    { title: '内置插件',         kind: '' },
  'settings-preset':     { title: 'Agent 预设',       kind: '' },
  'settings-priv':       { title: '特权权限',         kind: '' },
  'settings-bubble':     { title: '悬浮气泡',         kind: '' },
  'settings-style':      { title: 'AI 回复风格',      kind: '' },
  'settings-multimodal': { title: '多模态配置',       kind: '' },
  'settings-group':      { title: '交流群',           kind: '' },
  'plugins-panel':       { title: '插件面板',         kind: 'panel' },
  'model-picker':        { title: '模型选择器',       kind: '' },
  'access-mode':         { title: '访问模式选择器',   kind: '' },
  'preset-picker':       { title: 'Agent 预设选择器', kind: '' },
  'right-sidebar':       { title: '右侧边栏',         kind: 'panel' },
  'workfiles':           { title: '工作区文件',       kind: '' },
  'terminal':            { title: '终端',             kind: '' },
};

/**
 * 关系树：`父: [子...]`。
 *
 * 边的语义 = 「在父界面上点某个按钮，进入子界面」。按钮文案见 LABEL。
 * 依据是图谱里每屏的 `enter` 步骤链（从基态一路点过去的完整路径）。
 */
const TREE = {
  'hero':           ['drawer', 'right-sidebar', 'model-picker', 'access-mode', 'preset-picker'],
  'drawer':         ['settings', 'plugins-panel'],
  'right-sidebar':  ['workfiles', 'terminal'],
  'settings':       ['settings-general', 'settings-model', 'settings-plugins', 'settings-preset',
                     'settings-priv', 'settings-bubble', 'settings-style', 'settings-multimodal',
                     'settings-group'],
};

/** 进入某个界面时点的那个按钮（画在连线上）。 */
const LABEL = {
  'drawer':              '☰ 打开导航',
  'right-sidebar':       '打开右侧边栏',
  'model-picker':        '选择模型',
  'access-mode':         '访问模式',
  'preset-picker':       '选择 Agent 预设',
  'settings':            '设置',
  'plugins-panel':       '插件',
  'settings-general':    '通用设置',
  'settings-model':      '模型',
  'settings-plugins':    '内置插件',
  'settings-preset':     'Agent 预设',
  'settings-priv':       '特权权限',
  'settings-bubble':     '悬浮气泡',
  'settings-style':      'AI 回复风格',
  'settings-multimodal': '多模态配置',
  'settings-group':      '交流群',
  'workfiles':           '工作区文件',
  'terminal':            '新建终端',
};

// ══════════════════════════════════════════════════════════════════════
// 布局
// ══════════════════════════════════════════════════════════════════════
//
// ⚠️ **两条踩过的坑，都跟「手机截图是 1:2.22 竖长条」有关**：
//
// 1. **别用树形自动布局**（DFS 给叶子逐行编号）。17 个叶子逐行排下来 ≈ 8800px
//    高，适应窗口后缩到 12%，第一眼什么都看不清。
// 2. **别把「设置」的 7 个子页竖排**。7 个竖条竖排 = 7 行 ≈ 2750px 高，世界变成
//    1:3.3 的细长条；在 1000px 高的窗口里每个节点只剩 64px 宽，等于看不清。
//    **横向排开**才能把世界压到接近方形（这里 1470×1965，约 1:1.34）。
//
// 布局 = 手动网格 `[列, 行]`：
//   · 列 = 语义深度（起点 → 入口 → 面板 → 设置子页）
//   · 「设置」的 7 个子页排成 4 + 3 两行，占 col 3–6
//
// ⚠️ **跨 ≥2 列的连线必须走「总线」，不能直接画曲线。** 直接画会横穿中间列的
//    节点卡片（实测：`设置 → Agent 预设` 那条会从 `内置插件` 卡片上压过去）。
//    规则见下面 `routeEdge()`：相邻列才画曲线，跨列一律绕到上方总线。
//
// 改这里的行列时，`routeEdge()` 的规则不用动 —— 它按列差自动选路径。

const GRID = {
  // 第 0 行 —— 起点 + 它的五个直接入口，横铺满整幅（列坐标允许小数，见 routeEdge）
  'hero':                [0,   0],
  'drawer':              [1.6, 0],
  'right-sidebar':       [3.2, 0],
  'model-picker':        [4.8, 0],
  'access-mode':         [6.4, 0],
  'preset-picker':       [8,   0],

  // 第 1 行 —— 各面板的下级，放在各自父节点正下方
  'settings':            [1.6, 1],
  'plugins-panel':       [3.2, 1],
  'workfiles':           [4.8, 1],
  'terminal':            [6.4, 1],

  // 第 2 行 —— 设置的九个子页，横排铺满
  'settings-general':    [0, 2],
  'settings-model':      [1, 2],
  'settings-plugins':    [2, 2],
  'settings-preset':     [3, 2],
  'settings-priv':       [4, 2],
  'settings-bubble':     [5, 2],
  'settings-style':      [6, 2],
  'settings-multimodal': [7, 2],
  'settings-group':      [8, 2],
};

const NODE_W = 150;
const NODE_H = Math.round(NODE_W * 2400 / 1080);   // 截图比例 1080×2400
const HEAD_H = 34;
const NODE_TOTAL_H = NODE_H + HEAD_H;
const COL_W = NODE_W + 58;
const ROW_GAP = 132;               // 行间空隙 —— 跨行连线的车道就走在这里
const ROW_H = NODE_TOTAL_H + ROW_GAP;
const BUS_TOP = 104;               // 顶部总线区（第 0 行上方的同行跨列线走这里）

const pos = {};
for (const [id, [c, r]] of Object.entries(GRID)) {
  pos[id] = { x: c * COL_W, y: BUS_TOP + r * ROW_H };
}
const gridOf = (id) => GRID[id];

const COLS = Math.max(...Object.values(GRID).map((g) => g[0])) + 1;
const ROWS = Math.max(...Object.values(GRID).map((g) => g[1])) + 1;
const WORLD_W = (COLS - 1) * COL_W + NODE_W;
const WORLD_H = BUS_TOP + (ROWS - 1) * ROW_H + NODE_TOTAL_H + 40;

/**
 * 正交路由 —— 按「两节点是否同一行」分两种走法。
 *
 * ⚠️ **不能用贝塞尔。** 本图跨列边很多（`起点 → 访问模式` 跨 4 列、`设置 → 交流群`
 *    跨 7 列），弧线会**直接横穿中间列的卡片**（实测：`设置 → Agent 预设` 从
 *    `内置插件` 卡片上压过去）。正交路由让横向段只落在**车道**上，而车道（行间空隙、
 *    顶部总线区）里没有节点。
 *
 * 两种走法：
 *   · **同一行** —— 左右出入。相邻列画直线；跨列绕到该行上方的车道。
 *   · **不同行** —— 上下出入。从源节点**底部**下行到车道，横穿，再从目标**顶部**进入。
 *     这样不管目标在源的左下方还是右下方都成立（设置→子页就是左右都有）。
 *
 * `slot` 把同一车道上的多条线错开，免得叠成一条。
 */
function routeEdge(from, to, slot) {
  const a = pos[from], b = pos[to];
  const [ac, ar] = gridOf(from);
  const [bc, br] = gridOf(to);
  const r = 7;   // 拐角圆角

  const rowTop = (row) => BUS_TOP + row * ROW_H;
  const rowBot = (row) => rowTop(row) + NODE_TOTAL_H;
  const clamp = (v) => Math.max(10, Math.min(v, WORLD_H - 10));

  // ── 同一行 ──────────────────────────────────────────────────────────
  if (ar === br) {
    const y = a.y + NODE_TOTAL_H / 2;
    const x1 = ac < bc ? a.x + NODE_W : a.x;
    const x2 = ac < bc ? b.x : b.x + NODE_W;
    const lo = Math.min(ac, bc), hi = Math.max(ac, bc);

    // 中间没有别的节点 → 直接横线（列坐标是小数，所以按「有没有节点夹在中间」判）
    const blocked = Object.entries(GRID).some(([id, [c, rr]]) =>
      id !== from && id !== to && rr === ar && c > lo && c < hi);
    if (!blocked) return `M ${x1} ${y} L ${x2} ${y}`;

    // 跨列：绕到本行上方的车道
    const dir = ac < bc ? 1 : -1;
    const lane = clamp(rowTop(ar) - 26 - (slot % 4) * 16);
    const ex = x1 + dir * 16;
    return `M ${x1} ${y} L ${ex - dir * r} ${y} Q ${ex} ${y}, ${ex} ${y - r} ` +
      `L ${ex} ${lane + r} Q ${ex} ${lane}, ${ex + dir * r} ${lane} ` +
      `L ${x2 - dir * r} ${lane} Q ${x2} ${lane}, ${x2} ${lane + r} ` +
      `L ${x2} ${y - r} Q ${x2} ${y}, ${x2 - dir * r} ${y} ` +
      `L ${x2} ${y}`;
  }

  // ── 不同行 ──────────────────────────────────────────────────────────
  const cx1 = a.x + NODE_W / 2;
  const cx2 = b.x + NODE_W / 2;
  const down = br > ar;

  // 同列相邻行：直接竖线
  if (ac === bc && Math.abs(br - ar) === 1) {
    const y1 = down ? a.y + NODE_TOTAL_H : a.y;
    const y2 = down ? b.y : b.y + NODE_TOTAL_H;
    return `M ${cx1} ${y1} L ${cx2} ${y2}`;
  }
  // 车道落在两行之间的空隙里
  const lo = Math.min(ar, br), hi = Math.max(ar, br);
  const gapA = rowBot(lo), gapB = rowTop(hi);
  const lanes = Math.max(1, Math.floor((gapB - gapA - 24) / 15));
  const lane = clamp(gapA + 16 + (slot % lanes) * 15);

  const y1 = down ? a.y + NODE_TOTAL_H : a.y;   // 源节点出入边
  const y2 = down ? b.y : b.y + NODE_TOTAL_H;   // 目标节点出入边
  const v1 = down ? 1 : -1;                     // 从源出发的纵向方向
  const v2 = down ? -1 : 1;                     // 进入目标的纵向方向（与 v1 相反）

  return `M ${cx1} ${y1} L ${cx1} ${lane - v1 * r} ` +
    `Q ${cx1} ${lane}, ${cx1 + r} ${lane} ` +
    `L ${cx2 - r} ${lane} Q ${cx2} ${lane}, ${cx2} ${lane - v2 * r} ` +
    `L ${cx2} ${y2}`;
}

// ══════════════════════════════════════════════════════════════════════
// 渲染
// ══════════════════════════════════════════════════════════════════════

const world = document.getElementById('world');
const svg = document.getElementById('edges');
const nodesEl = document.getElementById('nodes');
const SVG_NS = 'http://www.w3.org/2000/svg';

world.style.width = WORLD_W + 'px';
world.style.height = WORLD_H + 'px';
svg.setAttribute('width', WORLD_W);
svg.setAttribute('height', WORLD_H);
svg.setAttribute('viewBox', `0 0 ${WORLD_W} ${WORLD_H}`);

document.getElementById('cnt').textContent = Object.keys(SHOTS).length;

// ── 连线 ────────────────────────────────────────────────────────────
const EDGES = [];
for (const [from, kids] of Object.entries(TREE)) {
  for (const to of kids) EDGES.push({ from, to });
}

let edgeSlot = 0;
for (const e of EDGES) {
  const a = pos[e.from], b = pos[e.to];
  const [ac, ar] = GRID[e.from];
  const [bc, br] = GRID[e.to];

  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', routeEdge(e.from, e.to, edgeSlot++));
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#3d444d');
  path.setAttribute('stroke-width', '1.6');
  svg.appendChild(path);

  // 箭头 —— 落在目标节点的**实际入边**上：
  //   同一行 → 左/右侧边；不同行 → 上/下边（与 routeEdge 的出入边一致）
  let ax, ay;
  if (ar === br) {
    ax = ac < bc ? b.x - 4 : b.x + NODE_W + 4;
    ay = b.y + NODE_TOTAL_H / 2;
  } else {
    ax = b.x + NODE_W / 2;
    ay = br > ar ? b.y - 4 : b.y + NODE_TOTAL_H + 4;
  }
  const arrow = document.createElementNS(SVG_NS, 'circle');
  arrow.setAttribute('cx', ax);
  arrow.setAttribute('cy', ay);
  arrow.setAttribute('r', '3');
  arrow.setAttribute('fill', '#58a6ff');
  svg.appendChild(arrow);

  // 标签 —— 放在路径真实中点（`getPointAtLength`，不是端点平均）
  const mid = path.getPointAtLength(path.getTotalLength() / 2);
  const lab = document.createElement('div');
  lab.className = 'edge-label';
  lab.textContent = LABEL[e.to] ?? e.to;
  lab.style.left = mid.x + 'px';
  lab.style.top = mid.y + 'px';
  nodesEl.appendChild(lab);
}

// ── 节点 ────────────────────────────────────────────────────────────
for (const [id, meta] of Object.entries(SHOTS)) {
  const el = document.createElement('div');
  el.className = 'node ' + (meta.kind || '');
  el.style.left = pos[id].x + 'px';
  el.style.top = pos[id].y + 'px';
  el.dataset.id = id;
  el.innerHTML =
    `<div class="head">${meta.title}<span class="id">${id}</span></div>` +
    `<img src="shots/${id}.png" alt="${meta.title}" loading="lazy">`;
  el.addEventListener('dblclick', (ev) => { ev.stopPropagation(); openLarge(id); });
  nodesEl.appendChild(el);
}

// ══════════════════════════════════════════════════════════════════════
// 平移 / 缩放
// ══════════════════════════════════════════════════════════════════════

let scale = 1, tx = 0, ty = 0;
const viewport = document.getElementById('viewport');
const zoomEl = document.getElementById('zoom');

function apply() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomEl.textContent = Math.round(scale * 100) + '%';
  // 网格随缩放变密/变疏，保持「无限画布」的手感
  viewport.style.backgroundSize = `${40 * scale}px ${40 * scale}px`;
  viewport.style.backgroundPosition = `${tx}px ${ty}px`;
}

function zoomAt(cx, cy, factor) {
  const next = Math.min(4, Math.max(0.05, scale * factor));
  const k = next / scale;
  tx = cx - (cx - tx) * k;
  ty = cy - (cy - ty) * k;
  scale = next;
  apply();
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

let dragging = false, sx = 0, sy = 0;
viewport.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.node')) return;
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  viewport.classList.add('dragging');
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy; apply();
});
viewport.addEventListener('pointerup', (e) => {
  dragging = false; viewport.classList.remove('dragging');
  try { viewport.releasePointerCapture(e.pointerId); } catch {}
});

function fitAll() {
  const pad = 40;
  const s = Math.min((innerWidth - pad * 2) / WORLD_W, (innerHeight - pad * 2) / WORLD_H);
  scale = Math.min(1, Math.max(0.05, s));
  tx = (innerWidth - WORLD_W * scale) / 2;
  ty = (innerHeight - WORLD_H * scale) / 2;
  apply();
}

/**
 * 首屏 = 适应窗口，但把左边留给 HUD。
 * ⚠️ 不要用 `focusRoot()` 当首屏：那样只看见起点那一支，整棵树大半在视口外，
 *    第一眼会以为画布是空的。
 */
function fitAllWithHud() {
  const padL = 340, padR = 40, padT = 40, padB = 40;
  const s = Math.min(
    (innerWidth - padL - padR) / WORLD_W,
    (innerHeight - padT - padB) / WORLD_H
  );
  scale = Math.min(1.1, Math.max(0.05, s));
  tx = padL + (innerWidth - padL - padR - WORLD_W * scale) / 2;
  ty = padT + (innerHeight - padT - padB - WORLD_H * scale) / 2;
  apply();
}

function focusRoot() {
  const p = pos['hero'];
  scale = 0.85;
  tx = innerWidth / 2 - (p.x + NODE_W / 2) * scale;
  ty = innerHeight / 2 - (p.y + (NODE_H + HEAD_H) / 2) * scale;
  apply();
}

function zoomBy(f) { zoomAt(innerWidth / 2, innerHeight / 2, f); }

// ── 双击看大图 ──────────────────────────────────────────────────────
function openLarge(id) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.9);' +
    'display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px';
  ov.innerHTML = `<img src="shots/${id}.png" style="max-height:100%;max-width:100%;` +
    `border-radius:10px;box-shadow:0 0 60px rgba(0,0,0,.8)">`;
  ov.addEventListener('click', () => ov.remove());
  document.body.appendChild(ov);
}

apply();
fitAllWithHud();
</script>
</body>
